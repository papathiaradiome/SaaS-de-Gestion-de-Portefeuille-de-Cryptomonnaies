version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "file:./data/dev.db"
      # ⚠️ En production : définir des secrets forts et une origine CORS explicite.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - api_data:/app/apps/api/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Le navigateur appelle le web (3000), qui proxifie vers l'API (3001).
      API_URL: http://api:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
