name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (API)
        run: npm run lint -w @cryptofolio/api

      - name: Unit tests (API)
        run: npm run test -w @cryptofolio/api

      - name: E2E tests (API)
        run: npm run test:e2e -w @cryptofolio/api

      - name: Build (API + Web)
        run: npm run build

      - name: Smoke test — migrations + seed offline
        run: |
          cd apps/api
          npx drizzle-kit migrate
          npm run db:seed
